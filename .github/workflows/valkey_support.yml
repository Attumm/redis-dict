name: Supports Valkey

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    services:
      redis:
        image: valkey/valkey
        ports:
          - 6379:6379

    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Run Unit Tests
        env:
          PYTHONPATH: src
        run: |
          coverage run -m unittest discover -s tests
