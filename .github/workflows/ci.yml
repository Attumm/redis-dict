name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Run Pylama
        run: |
          python -m pylama -i E501,E231 src

      - name: Run type check with mypy strict
        run: |
          mypy

      - name: Run Doctype Check
        run: |
          darglint src/redis_dict/
          pydocstyle src/redis_dict/

      - name: Run Security check
        run: |
          bandit -r src/redis_dict

      - name: Run Unit Tests
        env:
          PYTHONPATH: src
        run: |
          coverage run -m unittest discover -s tests

      - name: Upload coverage reports to Codecov, send only once
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
