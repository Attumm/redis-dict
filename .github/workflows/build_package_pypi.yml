name: Build and Upload to PyPI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, 'v*-pre-release' ]

jobs:

  build-and-test:
    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up uv with Python
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.0"
        python-version: '3.11'
        activate-environment: true

    - name: Install dependencies
      run: |
        uv sync --locked --extra dev --extra build

    - name: Run quality checks
      run: |
        python -m mypy
        darglint src/redis_dict/
        python -m pycodestyle src/redis_dict
        python -m pyflakes src/redis_dict
        source scripts/lib/checks.sh && check_complexity src/redis_dict/*.py
        python -m unittest discover -s tests

    - name: Run Security check
      run: |
        bandit -r src/redis_dict

    - name: Build package
      run: uv build

    - name: Store distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
        retention-days: 1

  publish-to-pypi:
    needs: [build-and-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
